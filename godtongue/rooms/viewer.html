<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single presentation column. Plan and spec beside the title, then walk-through, 360 view, stills. */
:root {
  --bg: #eceeea; --panel: #f7f8f5; --ink: #1d221f; --mute: #5f6862; --line: #d3d8d1; --accent: #1f5a44; --plan: #fbfcfa; --plan-wall: #2a302c; --plan-piece: #c9cfc7;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131614; --panel: #1b1f1c; --ink: #e8ebe6; --mute: #98a19a; --line: #2c322e; --accent: #7cc4a4; --plan: #181c19; --plan-wall: #d9ded7; --plan-piece: #39413b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131614; --panel: #1b1f1c; --ink: #e8ebe6; --mute: #98a19a; --line: #2c322e; --accent: #7cc4a4; --plan: #181c19; --plan-wall: #d9ded7; --plan-piece: #39413b; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
main { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 48px }
header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 32px; align-items: end }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute) }
h1 { font: 400 clamp(38px, 6vw, 68px)/1.02 var(--display); margin: 10px 0 14px; text-wrap: balance; letter-spacing: -.01em }
.spec { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 13px/1.4 var(--mono); color: var(--mute); font-variant-numeric: tabular-nums }
.spec b { color: var(--ink); font-weight: 500 }
figure.plan { margin: 0; background: var(--plan); border: 1px solid var(--line); border-radius: 4px; padding: 14px }
figure.plan svg { display: block; width: 100%; height: auto }
figure.plan figcaption { font: 400 11px/1.4 var(--mono); color: var(--mute); margin-top: 8px; display: flex; justify-content: space-between; gap: 8px }
section { display: grid; gap: 16px }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; flex-wrap: wrap }
h2 { font: 400 28px/1.1 var(--display); margin: 0 }
.sechead p { margin: 0; color: var(--mute); font-size: 13px }
video, .pano { width: 100%; max-width: 100%; display: block; background: #000; border-radius: 3px }
video, .live { aspect-ratio: 16 / 9 }
.live { width: 100%; max-width: 100%; position: relative; background: #000; border-radius: 3px; overflow: hidden }
.live canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab }
.live .hint { position: absolute; left: 12px; top: 12px; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .45); padding: 7px 10px; border-radius: 2px; pointer-events: none }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.controls input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--accent) }
.controls .t { font: 400 12px/1 var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; min-width: 72px }
.pano { aspect-ratio: 16 / 8; position: relative; overflow: hidden }
.pano canvas { width: 100%; height: 100%; display: block }
.pano .hint { position: absolute; left: 12px; bottom: 12px; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .45); padding: 7px 10px; border-radius: 2px; pointer-events: none }
.tabs { display: flex; gap: 6px; flex-wrap: wrap }
.tabs button { font: 500 12px/1 var(--mono); color: var(--mute); background: transparent; border: 1px solid var(--line); padding: 8px 10px; border-radius: 2px; cursor: pointer }
.controls button { font: 500 12px/1 var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 8px 12px; border-radius: 2px; cursor: pointer }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.tabs button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 22px 18px }
.still { margin: 0; display: grid; gap: 8px; cursor: zoom-in; border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit }
.still img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; border-radius: 2px; background: var(--panel) }
.still .cap { display: flex; justify-content: space-between; gap: 12px; align-items: baseline }
.still .name { font-weight: 600; font-size: 14px }
.still .num { font: 500 12px/1 var(--mono); color: var(--accent); margin-right: 8px }
.still .meta { font: 400 12px/1.3 var(--mono); color: var(--mute); white-space: nowrap }
.still:focus-visible, .tabs button:focus-visible, .lb button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.lb { position: fixed; inset: 0; background: rgba(8, 10, 9, .92); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.lb img { max-width: 100%; max-height: calc(100% - 48px); object-fit: contain }
.lb .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; max-width: 1400px; color: #e8ebe6; font: 400 12px/1 var(--mono) }
.lb button { font: 500 12px/1 var(--mono); color: #e8ebe6; background: transparent; border: 1px solid #4a514c; padding: 8px 12px; border-radius: 2px; cursor: pointer }
.lb-inner { display: grid; gap: 12px; justify-items: center; width: 100%; height: 100%; align-content: center }
footer { color: var(--mute); font: 400 12px/1.5 var(--mono); border-top: 1px solid var(--line); padding-top: 14px }
@media (max-width: 760px) { header { grid-template-columns: 1fr } .pano { aspect-ratio: 4 / 3 } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>

<main>
  <header>
    <div>
      <div class="eyebrow">Interior &middot; godtongue room</div>
      <h1 id="title"></h1>
      <div class="spec" id="spec"></div>
    </div>
    <figure class="plan">
      <svg id="plan" role="img" aria-label="Floor plan with camera positions"></svg>
      <figcaption><span>Plan &middot; north up</span><span id="plan-scale"></span></figcaption>
    </figure>
  </header>

  <section id="walk-sec">
    <div class="sechead"><h2>Walk-through</h2><p id="walk-note"></p></div>
    <div class="tabs" id="walk-tabs"><button id="mode-video" aria-pressed="true">Video</button><button id="mode-live" aria-pressed="false">Walk it live</button></div>
    <video id="walk" controls playsinline muted loop preload="metadata"></video>
    <div class="live" id="live" hidden><canvas id="live-c" aria-label="Live walk-through, drag to look around"></canvas><span class="hint" id="live-hint">Loading the room&hellip;</span></div>
    <div class="controls" id="live-ctl" hidden><button id="live-play" class="tabs-btn">Pause</button><input type="range" id="live-t" min="0" value="0" aria-label="Position along the walk"><span class="t" id="live-time">0.0 s</span></div>
  </section>

  <section id="pano-sec">
    <div class="sechead"><h2>360 view</h2><div class="tabs" id="pano-tabs"></div></div>
    <div class="pano"><canvas id="pano" aria-label="360 degree view, drag to look around"></canvas><span class="hint">Drag to look &middot; pinch or scroll to zoom</span></div>
  </section>

  <section>
    <div class="sechead"><h2>Stills</h2><p id="stills-note"></p></div>
    <div class="grid" id="stills"></div>
  </section>

  <footer id="foot"></footer>
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-inner">
    <img id="lb-img" alt="">
    <div class="bar"><span id="lb-cap"></span><span style="display:flex;gap:8px"><button id="lb-prev">Previous</button><button id="lb-next">Next</button><button id="lb-close">Close</button></span></div>
  </div>
</div>

<script>
const M = __MANIFEST__;
const $ = (id) => document.getElementById(id);
const fmt = (x) => (Math.round(x * 100) / 100).toFixed(2).replace(/0$/, '');
$('title').textContent = M.title;
const [W, D, H] = M.size;
$('spec').innerHTML = [`<span><b>${fmt(W)} \u00d7 ${fmt(D)} m</b> floor</span>`, `<span><b>${fmt(H)} m</b> ceiling</span>`, `<span><b>${(W * D).toFixed(1)} m\u00b2</b></span>`,
  `<span><b>${M.shots.length}</b> stills</span>`].join('');

// ── floor plan, drawn to scale from the room file
(function plan() {
  const pad = 0.35, sx = W + pad * 2, sy = D + pad * 2, svg = $('plan');
  svg.setAttribute('viewBox', `${-pad} ${-pad} ${sx} ${sy}`);
  const Y = (n) => D - n;                                    // north up
  const el = (tag, a, txt) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
  for (const p of M.pieces) el('rect', { x: p.rect[0], y: Y(p.rect[3]), width: p.rect[1] - p.rect[0], height: p.rect[3] - p.rect[2], rx: 0.04, fill: p.kind === 'rug' ? 'none' : 'var(--plan-piece)', stroke: p.kind === 'rug' ? 'var(--plan-piece)' : 'none', 'stroke-width': 0.03, 'stroke-dasharray': p.kind === 'rug' ? '0.08 0.06' : '' });
  el('rect', { x: 0, y: 0, width: W, height: D, fill: 'none', stroke: 'var(--plan-wall)', 'stroke-width': 0.1 });
  for (const o of M.openings) {                              // gaps in the wall line
    const s0 = o.at - o.width / 2, s1 = o.at + o.width / 2;
    const seg = { north: [s0, 0, s1, 0], south: [s0, D, s1, D], east: [W, Y(s0), W, Y(s1)], west: [0, Y(s0), 0, Y(s1)] }[o.wall];
    el('line', { x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3], stroke: 'var(--plan)', 'stroke-width': 0.14 });
    el('line', { x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3], stroke: o.kind === 'window' ? 'var(--accent)' : 'var(--mute)', 'stroke-width': 0.03 });
  }
  for (const w of M.walks) el('polyline', { points: w.points.map(([e, n]) => `${e},${Y(n)}`).join(' '), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 0.03, 'stroke-dasharray': '0.1 0.07', opacity: 0.8 });
  for (const p of M.panoramas) { el('circle', { cx: p.at[0], cy: Y(p.at[1]), r: 0.14, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 0.03 }); el('circle', { cx: p.at[0], cy: Y(p.at[1]), r: 0.04, fill: 'var(--accent)' }); }
  M.shots.forEach((s, i) => {
    const [e, n] = s.from, [te, tn] = s.at, a = Math.atan2(Y(tn) - Y(n), te - e), half = Math.atan(18 / s.lens), L = 0.55;
    el('path', { d: `M${e},${Y(n)} L${e + L * Math.cos(a - half)},${Y(n) + L * Math.sin(a - half)} L${e + L * Math.cos(a + half)},${Y(n) + L * Math.sin(a + half)} Z`, fill: 'var(--accent)', opacity: 0.16 });
    el('circle', { cx: e, cy: Y(n), r: 0.11, fill: 'var(--accent)' });
    el('text', { x: e, y: Y(n) + 0.045, 'text-anchor': 'middle', 'font-size': 0.13, 'font-family': 'IBM Plex Mono, monospace', fill: 'var(--plan)' }, i + 1);
  });
  $('plan-scale').textContent = `${fmt(W)} m wide`;
})();

// ── walk-through
if (M.walks.length) {
  const w = M.walks[0], v = $('walk');
  v.src = w.file; if (w.poster) v.poster = w.poster;
  $('walk-note').textContent = `${w.seconds} s at eye height \u00b7 ${w.size[0]}\u00d7${w.size[1]}` + (w.method === 'baked' ? ` \u00b7 light baked once, drawn in ${Math.round(w.renderSeconds)} s` : '');
} else $('walk-sec').hidden = true;

// ── live walk: the same path drawn in real time from the baked light; drag to look around
__BAKED_JS__
if (M.walks.length && M.live) {
  let R = null, playing = true, t = 0, last = 0, yaw = 0, pitch = 0, started = false;
  const fps = 24, cv = $('live-c'), slider = $('live-t');
  const setMode = (live) => {
    $('mode-video').setAttribute('aria-pressed', !live); $('mode-live').setAttribute('aria-pressed', live);
    $('walk').hidden = live; $('live').hidden = !live; $('live-ctl').hidden = !live;
    if (live) { $('walk').pause(); start(); } else playing = false;
  };
  $('mode-video').onclick = () => setMode(false); $('mode-live').onclick = () => { playing = true; $('live-play').textContent = 'Pause'; setMode(true); };
  function aim(fr) {                                  // the path's own aim, turned by the viewer's drag
    const e = fr.slice(0, 3), d = [fr[3] - e[0], fr[4] - e[1], fr[5] - e[2]];
    const h = Math.hypot(d[0], d[2]), a0 = Math.atan2(d[0], d[2]) + yaw, p0 = Math.atan2(d[1], h) + pitch;
    return [e, [e[0] + Math.sin(a0) * Math.cos(p0), e[1] + Math.sin(p0), e[2] + Math.cos(a0) * Math.cos(p0)]];
  }
  function draw() { const F = R.walks[0].frames, i = Math.max(0, Math.min(F.length - 1, Math.floor(t))); const [e, g] = aim(F[i]); R.view(e, g, 24);
    slider.value = i; $('live-time').textContent = `${(i / fps).toFixed(1)} s`; }
  function loop(now) {
    if ($('live').hidden) { started = false; return; }
    if (playing) { t += Math.max(0, now - last) / 1000 * fps; if (t >= R.walks[0].frames.length) t = 0; }
    last = now; draw(); requestAnimationFrame(loop);
  }
  async function start() {
    if (started) return; started = true;
    try {
      if (!R) { R = await mountBaked(cv, 'baked'); slider.max = R.walks[0].frames.length - 1; $('live-hint').textContent = 'Drag to look around'; }
      last = performance.now(); requestAnimationFrame(loop);
    } catch (err) { $('live-hint').textContent = 'This browser cannot draw the live room. The video shows the same walk.'; started = false; }
  }
  $('live-play').onclick = () => { playing = !playing; $('live-play').textContent = playing ? 'Pause' : 'Play'; };
  slider.oninput = () => { t = +slider.value; playing = false; $('live-play').textContent = 'Play'; };
  let drag = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, yaw, pitch }; cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointermove', e => { if (!drag) return; const k = 1.3 / cv.clientWidth * 1.6; yaw = drag.yaw - (e.clientX - drag.x) * k; pitch = Math.max(-1.2, Math.min(1.2, drag.pitch + (e.clientY - drag.y) * k)); });
  const up = () => { drag = null; cv.style.cursor = 'grab'; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('dblclick', () => { yaw = 0; pitch = 0; });
} else $('walk-tabs').hidden = true;

// ── 360 view (drag to look; the shader turns each pixel into a direction and reads the panorama)
__PANO_JS__
if (M.panoramas.length) {
  let viewer = null;
  const show = (i) => {
    [...$('pano-tabs').children].forEach((b, k) => b.setAttribute('aria-pressed', k === i));
    try { viewer = mountPano($('pano'), M.panoramas[i].file); } catch (e) { $('pano-sec').querySelector('.hint').textContent = 'This browser cannot show the 360 view'; }
  };
  M.panoramas.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name.replace(/-/g, ' '); b.onclick = () => show(i); $('pano-tabs').appendChild(b); });
  show(0);
} else $('pano-sec').hidden = true;

// ── stills
const grid = $('stills');
M.shots.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'still'; b.type = 'button';
  b.innerHTML = `<img loading="lazy" src="${s.file}" alt="${s.name.replace(/-/g, ' ')}"><span class="cap"><span><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="name"></span></span><span class="meta">${Math.round(s.lens)} mm \u00b7 eye ${fmt(s.height)} m</span></span>`;
  b.querySelector('.name').textContent = s.name.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
  if (s.aspect === 'portrait') b.querySelector('img').style.aspectRatio = '3 / 2';
  b.onclick = () => openLb(i);
  grid.appendChild(b);
});
$('stills-note').textContent = 'Numbers match the camera marks on the plan';
let cur = 0;
function openLb(i) { cur = (i + M.shots.length) % M.shots.length; const s = M.shots[cur]; $('lb-img').src = s.full || s.file; $('lb-img').alt = s.name; $('lb-cap').textContent = `${String(cur + 1).padStart(2, '0')} \u00b7 ${s.name.replace(/-/g, ' ')} \u00b7 ${Math.round(s.lens)} mm`; $('lb').hidden = false; $('lb-close').focus(); }
$('lb-close').onclick = () => { $('lb').hidden = true; };
$('lb-prev').onclick = () => openLb(cur - 1); $('lb-next').onclick = () => openLb(cur + 1);
$('lb').addEventListener('click', (e) => { if (e.target === $('lb') || e.target.classList.contains('lb-inner')) $('lb').hidden = true; });
document.addEventListener('keydown', (e) => { if ($('lb').hidden) return; if (e.key === 'Escape') $('lb').hidden = true; if (e.key === 'ArrowRight') openLb(cur + 1); if (e.key === 'ArrowLeft') openLb(cur - 1); });
$('foot').textContent = `Written in godtongue (${M.source}) \u00b7 path traced and denoised \u00b7 ${M.quality}`;
</script>
