<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio wall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.app{--bg:#0b0b0c;--panel:#161618;--raised:#1d1d20;--hover:#1a1a1d;--ink:#ece9e4;--ink2:#b3b0aa;--muted:#8e8b85;--line:rgba(255,255,255,.14);--ring:0 0 0 1px rgba(255,255,255,.09);--shadow:0 20px 50px rgba(0,0,0,.55);--scrim:rgba(11,11,12,.86);--accent:#e0b552;--on-accent:#1a1407;--accent-text:#f0d58a;
  display:flex;min-height:1180px;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:light){.app:not([data-theme="dark"]){--bg:#f6f4f0;--panel:#ffffff;--raised:#ece9e3;--hover:#ebe8e2;--ink:#1b1a18;--ink2:#4a4743;--muted:#6b6862;--line:rgba(0,0,0,.18);--ring:0 0 0 1px rgba(0,0,0,.08);--shadow:0 18px 44px rgba(0,0,0,.14);--scrim:rgba(246,244,240,.88);--accent-text:#7a5800}}
.app[data-theme="light"]{--bg:#f6f4f0;--panel:#ffffff;--raised:#ece9e3;--hover:#ebe8e2;--ink:#1b1a18;--ink2:#4a4743;--muted:#6b6862;--line:rgba(0,0,0,.18);--ring:0 0 0 1px rgba(0,0,0,.08);--shadow:0 18px 44px rgba(0,0,0,.14);--scrim:rgba(246,244,240,.88);--accent-text:#7a5800}
.side{flex:0 0 208px;width:208px;box-sizing:border-box;padding:20px 12px;display:flex;flex-direction:column;gap:26px}
.side a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink2)}
.side a:hover{background:var(--hover);color:var(--ink)}
.side a.on{background:var(--hover);color:var(--ink);font-weight:500}
.lbl{padding:0 12px 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.col{flex:1;min-width:0}
.hd{position:sticky;top:0;z-index:30;background:var(--scrim);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);max-height:100vh;overflow:auto}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.wm{font:400 26px/1 'Instrument Serif',Georgia,serif;letter-spacing:-.01em;color:var(--ink);padding:0 6px 0 2px;flex:none}
.pill{flex:1 1 auto;min-width:0;max-width:680px;margin:0 auto;height:44px;box-sizing:border-box;border-radius:22px;border:0;background:var(--panel);box-shadow:var(--ring);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:15px;cursor:text;text-align:left}
.pill .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ic:hover{background:var(--hover)}
.menu{display:none}
.tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;height:42px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--ink)}
.pp{width:calc(100% - 24px);max-width:780px;margin:6px auto 12px;box-sizing:border-box;padding:12px;border-radius:20px;background:var(--panel);box-shadow:var(--ring),var(--shadow);display:flex;flex-direction:column;gap:12px}
.refrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ref{position:relative;width:40px;height:58px;flex:none}
.ref img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px}
.rx{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.add{width:40px;height:58px;flex:none;border-radius:6px;border:1px dashed var(--line);background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer}
.make{height:40px;padding:0 18px 0 14px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.make:hover{filter:brightness(1.07)}
.pinput{flex:1 1 220px;min-width:0;height:44px;box-sizing:border-box;border:0;background:transparent;color:var(--ink);font:400 16px Inter,system-ui,sans-serif;padding:0 4px}
.wallp{padding:2px 4px 40px}
.tile{display:block;overflow:hidden;margin:0 0 6px;break-inside:avoid;cursor:grab;-webkit-user-drag:element}
.tile img{display:block;width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tile:hover img{transform:scale(1.025)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tray{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;padding:8px;border-radius:24px;background:var(--panel);box-shadow:var(--ring),var(--shadow)}
.zone{width:100px;height:84px;box-sizing:border-box;border-radius:16px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);text-align:center}
.zone.hot{border-color:var(--accent);border-style:solid;background:var(--hover);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;max-width:calc(100% - 24px);box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:24px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.toast button,.toast a{height:32px;padding:0 14px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){.side{display:none}.menu{display:flex}.hrow{padding:8px 8px 2px}.pill{height:42px}.pinput{flex:1 1 100%}}
@media (min-width:761px){.wallp{padding:4px 12px 40px}.hrow .wm{display:none}.hrow{padding-left:16px}}
</style>
</helmet>
<div class="app" data-theme="{{theme}}">

  <nav class="side" aria-label="Projects">
    <div class="wm" style="padding:0 12px">Morgana</div>
    <div><a class="on" href="Main.dc.html">Wall</a></div>
    <div>
      <div class="lbl">Projects</div>
      <a href="Detail.dc.html">Goku</a>
      <a href="Main.dc.html">Marilyn</a>
      <a href="Main.dc.html">The Bride</a>
      <a href="Main.dc.html">Stages</a>
      <a href="Main.dc.html">Videos</a>
      <a href="Main.dc.html">Posts</a>
    </div>
  </nav>

  <div class="col">
    <header class="hd">
      <div class="hrow">
        <button type="button" class="ic menu" aria-label="Projects">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <a class="wm" href="Main.dc.html">Morgana</a>
        <button type="button" class="pill" onClick="{{ togglePrompt }}" aria-expanded="{{ open }}">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="#e0b552" aria-hidden="true" style="flex:none"><path d="M10 1.5c.5 4.6 2.4 6.5 7 7-4.6.5-6.5 2.4-7 7-.5-4.6-2.4-6.5-7-7 4.6-.5 6.5-2.4 7-7Z"/></svg>
          <span class="t">Describe a card, or drop one here</span>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.5" cy="8.5" r="1.3"/><path d="m3.5 14 4-3.5 3 2.5 2.5-2 3.5 3"/></svg>
        </button>
        <button type="button" class="ic" aria-label="Switch light and dark" onClick="{{ toggleTheme }}">
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.7 6.7 0 0 0 10.7 10.7Z"/></svg>
          </sc-if>
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </sc-if>
        </button>
      </div>

      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <form class="pp">
          <div class="refrow">
            <span style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-right:4px">References</span>
            <sc-for list="{{ refs }}" as="r" hint-placeholder-count="2">
              <span class="ref">
                <img src="{{ r.src }}" alt="{{ r.alt }}">
                <button type="button" class="rx" aria-label="Remove this reference" onClick="{{ r.remove }}">
                  <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m1 1 6 6M7 1 1 7"/></svg>
                </button>
              </span>
            </sc-for>
            <button type="button" class="add" aria-label="Add a reference image">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <label for="prompt" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Describe a card</label>
            <input id="prompt" class="pinput" type="text" value="a brass ticket card, red enamel, gold signature, chrome bezel">
            <button type="button" class="chip">Card 5:7</button>
            <button type="button" class="chip">4 options</button>
            <button type="submit" class="make">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
              Make
            </button>
          </div>
        </form>
      </sc-if>

      <div class="tabs" role="tablist" aria-label="Categories">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <button type="button" role="tab" class="tab {{ t.on }}" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}">{{ t.label }}</button>
        </sc-for>
      </div>
    </header>

    <main class="wallp">
      <section aria-label="Wall" style="columns:{{cols}} 150px;column-gap:4px">
        <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="9">
          <a class="tile" href="Detail.dc.html" draggable="true" aria-label="{{ t.alt }}" style="border-radius:{{ t.r }};opacity:{{ t.op }}" onDragStart="{{ t.dragStart }}" onDragEnd="{{ t.dragEnd }}">
            <img src="{{ t.src }}" alt="{{ t.alt }}" width="{{ t.w }}" height="{{ t.h }}" draggable="false">
          </a>
        </sc-for>
      </section>
    </main>
  </div>

  <sc-if value="{{ dragging }}" hint-placeholder-val="{{ false }}">
    <div class="tray" role="group" aria-label="Drop the card on one of these">
      <div class="zone {{ hotDispose }}" onDragOver="{{ over }}" onDragEnter="{{ enterDispose }}" onDragLeave="{{ leave }}" onDrop="{{ dropDispose }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        Remove
      </div>
      <div class="zone {{ hotNew }}" onDragOver="{{ over }}" onDragEnter="{{ enterNew }}" onDragLeave="{{ leave }}" onDrop="{{ dropNew }}">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5c.5 4.6 2.4 6.5 7 7-4.6.5-6.5 2.4-7 7-.5-4.6-2.4-6.5-7-7 4.6-.5 6.5-2.4 7-7Z"/></svg>
        New card
      </div>
      <div class="zone {{ hotEdit }}" onDragOver="{{ over }}" onDragEnter="{{ enterEdit }}" onDragLeave="{{ leave }}" onDrop="{{ dropEdit }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"/></svg>
        Edit
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toastText }}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status">
      <span>{{ toastText }}</span>
      <sc-if value="{{ toastUndo }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ undo }}">Undo</button></sc-if>
      <sc-if value="{{ toastOpen }}" hint-placeholder-val="{{ false }}"><a href="Detail.dc.html">Open editor</a></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"auto","options":["auto","dark","light"],"section":"Look"},"cols":{"editor":"int","default":4,"min":2,"max":6,"section":"Wall"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  state = { tab: 'all', hidden: [], dragging: null, zone: null, toast: null, open: null, refs: ['goku-front', 'marilyn-front'], theme: null };

  renderVals() {
    const s = this.state, p = this.props;
    const ALL = [
      { id: 'goku-front', cat: 'cards', label: 'Goku, front', src: '/_blob/170609c1259ea59d1acf1689d5b1ca45', w: 592, h: 914, r: '0' },
      { id: 'graffiti', cat: 'videos', label: 'Graffiti', src: '/_blob/d70fe354b1686dc4fded15279291e5e2', w: 873, h: 1335, r: '14px' },
      { id: 'marilyn-front', cat: 'cards', label: 'Marilyn, front', src: '/_blob/4a12c697e3b0a396e53b898e8d41d53d', w: 592, h: 914, r: '0' },
      { id: 'goku-back', cat: 'cards', label: 'Goku, back', src: '/_blob/fc05a358baf845135ab08198e27b7c0a', w: 592, h: 914, r: '0' },
      { id: 'three-bodies', cat: 'stages', label: 'Three bodies', src: '/_blob/11b37f4d44157e2f8bd792e8dfc151d4', w: 1500, h: 1100, r: '14px' },
      { id: 'bride-back', cat: 'cards', label: 'The Bride, back', src: '/_blob/00e6f7bd7f8193ea63f2cc2aeeda139d', w: 592, h: 914, r: '0' },
      { id: 'post', cat: 'posts', label: 'Sale post', src: '/_blob/db8dcf6bca7a0fd1ffb53e5c647ddb9f', w: 800, h: 970, r: '14px' },
      { id: 'mean-reversion', cat: 'videos', label: 'Mean reversion', src: '/_blob/cafd2797046341f5c010482dd4aeab7c', w: 1080, h: 1920, r: '14px' },
      { id: 'card-on-desk', cat: 'stages', label: 'Card on desk', src: '/_blob/d80ec1e62757e381070edd94a3cd516a', w: 1080, h: 1350, r: '14px' }
    ];
    const by = (id) => ALL.find((x) => x.id === id);
    const flash = (toast) => {
      clearTimeout(this._t);
      this.setState({ toast });
      this._t = setTimeout(() => this.setState({ toast: null }), 5000);
    };
    const finish = () => this.setState({ dragging: null, zone: null });
    const dispose = (id) => {
      this.setState({ hidden: [...s.hidden, id] });
      flash({ text: by(id).label + ' removed', undo: true, id });
    };
    const theme = s.theme ?? p.theme ?? 'auto';
    const light = theme === 'light' || (theme === 'auto' && typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    const open = s.open ?? false;
    const tiles = ALL.filter((t) => !s.hidden.includes(t.id) && (s.tab === 'all' || t.cat === s.tab)).map((t) => ({
      ...t, alt: t.label, op: s.dragging === t.id ? 0.35 : 1,
      dragStart: (e) => { e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; this._done = false; this.setState({ dragging: t.id }); },
      dragEnd: (e) => {
        const off = (e.screenX !== 0 || e.screenY !== 0) && (e.clientX < 0 || e.clientY < 0 || e.clientX > window.innerWidth || e.clientY > window.innerHeight);
        const id = t.id;
        finish();
        if (!this._done && off) dispose(id);
      }
    }));
    const tabs = [['all', 'All'], ['cards', 'Cards'], ['posts', 'Posts'], ['stages', 'Stages'], ['videos', 'Videos']].map(([id, label]) => ({
      label, on: s.tab === id ? 'on' : '', sel: s.tab === id, pick: () => this.setState({ tab: id })
    }));
    const refs = s.refs.map((id) => ({ src: by(id).src, alt: 'Reference: ' + by(id).label, remove: () => this.setState({ refs: s.refs.filter((x) => x !== id) }) }));
    const t = s.toast;
    return {
      theme: theme, isLight: light, isDark: !light, cols: p.cols ?? 4,
      open, tiles, tabs, refs, dragging: !!s.dragging,
      hotDispose: s.zone === 'dispose' ? 'hot' : '', hotNew: s.zone === 'new' ? 'hot' : '', hotEdit: s.zone === 'edit' ? 'hot' : '',
      togglePrompt: () => this.setState({ open: !open }),
      toggleTheme: () => this.setState({ theme: light ? 'dark' : 'light' }),
      over: (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; },
      leave: () => this.setState({ zone: null }),
      enterDispose: (e) => { e.preventDefault(); this.setState({ zone: 'dispose' }); },
      enterNew: (e) => { e.preventDefault(); this.setState({ zone: 'new' }); },
      enterEdit: (e) => { e.preventDefault(); this.setState({ zone: 'edit' }); },
      dropDispose: (e) => { e.preventDefault(); this._done = true; const id = s.dragging; finish(); if (id) dispose(id); },
      dropNew: (e) => {
        e.preventDefault(); this._done = true; const id = s.dragging;
        this.setState({ dragging: null, zone: null, open: true, refs: [...s.refs.filter((x) => x !== id), id].slice(-4) });
        flash({ text: 'Added as a reference for a new card' });
      },
      dropEdit: (e) => { e.preventDefault(); this._done = true; const id = s.dragging; finish(); flash({ text: 'Edit ' + by(id).label, open: true }); },
      undo: () => { const id = t && t.id; this.setState({ hidden: s.hidden.filter((x) => x !== id), toast: null }); },
      toastText: t ? t.text : '', toastUndo: !!(t && t.undo), toastOpen: !!(t && t.open)
    };
  }
}
</script>
</body>
</html>
