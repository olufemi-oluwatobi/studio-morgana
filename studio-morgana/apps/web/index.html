<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Studio Morgana</title>
  <link rel="preload" href="/fonts/coolvetica.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="prefetch" href="/runtime/compiler.worker.js" as="script">
  <script>
    // theme before first paint, so there is no flash
    try { var t = localStorage.getItem('morgana-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
