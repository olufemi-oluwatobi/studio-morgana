sides:
  front:
    ops:
      - { op: brush, params: { angle_deg: 0 } }
      - { op: plate, mask: card, metal: metal.foil }
      - { op: emboss, mask: rim, params: { height_mm: 0.1 } }
      - { op: plate,  mask: rim, metal: metal.rim }
      - op: print
        on_foil: true
        mask: art
        white: white-front
        image: { src: ../assets/star-front.png, zone: art, filters: [] }
  back:
    ops:
      - { op: brush,  params: { angle_deg: 0 } }
      - { op: foil,   mask: card, metal: metal.foil, params: { emboss: 0 } }
      - { op: deboss, mask: [b-rays, -b-clear], params: { height_mm: 0.02 } }
      - { op: emboss, mask: b-platform, params: { height_mm: 0.03 } }
      - { op: emboss, mask: [b-frame, b-astrolabe, b-moons, b-compass-lo], params: { height_mm: 0.06 } }
      - { op: emboss, mask: b-compass-hi, params: { height_mm: 0.05 } }
      - { op: deboss, mask: [b-pressed, "&b-platform"], params: { height_mm: 0.04 } }
      - { op: deboss, mask: [b-pressed, -b-platform], params: { height_mm: 0.04 } }
      - { op: deboss, mask: [b-moon-shadow, "&b-moons"], params: { height_mm: 0.07 } }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
