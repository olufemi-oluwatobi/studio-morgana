# FANCARD MANIFEST v0.2 · XVII The Star · relief back
# Front: the print-on-foil tarot (same as star.card.yaml).
# Back: the Tinsel Queen method only (one foil over the whole card, design carried purely by
# raised and pressed relief, no ink) with its own look: silver holo-silk, a celestial astrolabe,
# raised stars, pressed constellation lines, a stacked compass star, moon phases, pressed rays.
# Build:  python3 fancard.py manifests/star-relief.card.yaml

fancard: 0.2
id: star/set-01-relief
template: tarot-on-foil@0 + astrolabe-relief@0
seed: 20261107

edition: { "no": 1, of: 1000, set: 1 }
creator: { name: The Star }

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1080, 1669]

zones:
  card:   { rect: [11, 11, 1058, 1647], r: 54 }
  art:    { rect: [70, 70, 940, 1529], r: 30 }
  window: { rect: [70, 70, 940, 1529], r: 30 }   # card shell needs one; no photo layer is printed into it

tokens:
