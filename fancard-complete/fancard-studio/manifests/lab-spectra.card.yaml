# FANCARD MANIFEST v0.2 · base-lab experiment (not a release card)
# BASE LAB B · Black Spectra: mirror-black PVD, an engraved guilloche whose cuts are filled
# with holo-ice foil, so colour lives only in the lines and moves with the light.
# Build:  python3 fancard.py manifests/lab-spectra.card.yaml

fancard: 0.2
id: lab/spectra
template: base-lab-spectra@0
seed: 20261107

edition: { "no": 1, of: 1000, set: 1 }
creator: { name: Oxana }

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1080, 1669]

zones:
  card:      { rect: [11, 11, 1058, 1647], r: 54 }
  field:     { rect: [44, 44, 992, 1581], r: 34 }
  window:    { rect: [170, 240, 740, 1010], r: 22 }
  sig-front: { center: [540, 1338], max_width: 560, size: 150, rotate_deg: -5, overlay: true }

tokens:
  enamel:
    niello: { name: niello, hex: "#0b0c0f", process: niello-inlay }
  metal:
    base:  { finish: mirror-black, polish: mirror }
    frame: { finish: mirror-chrome, polish: mirror }
    spectra: { finish: holo-ice }
  type:
    caps:   { family: Bodoni Moda, weight: 400 }
    script: { family: Mr Dafoe }

components:
  outer-rules:
    kind: shape.draw
    items:
      - { type: rect, rect: [28, 28, 1024, 1613], r: 46, w: 4 }
  frame:
    kind: shape.draw
    items:
      - { type: rect, rect: [152, 222, 776, 1046], r: 32, w: 10 }
      - { type: rect, rect: [136, 206, 808, 1078], r: 40, w: 2.2 }
  frame-zone:
    kind: shape.draw
    items:
      - { type: rect, rect: [128, 198, 824, 1094], r: 44, fill: true }
  edition:
    kind: shape.draw
    items:
      - { type: text, at: [540, 1488], font: caps, size: 34, track: 10, text: "Nº {edition.no:04}" }
      - { type: text, at: [540, 1530], font: caps, size: 15, track: 6, text: "ONE OF {edition.of}  ·  SET {edition.set:02}  ·  FANCARD" }
  signature:
    kind: type.signature
    params: { text: "{creator.name}", font: script }
  guilloche:
    kind: pattern.guilloche
    params: { bands: 20, waves: 7, wavelength: 210, line: 1.7 }

sides:
  front:
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.base }
      - { op: engrave, mask: [guilloche, -frame-zone], params: { depth_mm: 0.025 } }
      - { op: foil,    mask: [guilloche, -frame-zone], metal: metal.spectra, params: { emboss: 0 } }
      - { op: etch,    mask: edition }
      - { op: emboss,  mask: [outer-rules, frame], params: { height_mm: 0.1 } }
      - { op: plate,   mask: [outer-rules, frame], metal: metal.frame }
      - op: print
        mask: window
        image:
          src: ../assets/oxana.jpg
          focus: [0.5, 0.2]
          filters: []
      - { op: engrave, mask: "grow(signature,10)", place: { signature: sig-front }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: "grow(signature,10)", place: { signature: sig-front }, color: enamel.niello }
      - { op: emboss,  mask: signature, place: { signature: sig-front }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: signature, place: { signature: sig-front }, metal: metal.frame }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
