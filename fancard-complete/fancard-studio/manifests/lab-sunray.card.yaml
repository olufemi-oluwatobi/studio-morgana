# FANCARD MANIFEST v0.2 · base-lab experiment (not a release card)
# BASE LAB A · Sunray Chrome: mirror chrome cut with 360 engine-turned rays from the photo,
# frosted margin + lettering. Light runs round the rays as the card tilts (watch-dial effect).
# Build:  python3 fancard.py manifests/lab-sunray.card.yaml

