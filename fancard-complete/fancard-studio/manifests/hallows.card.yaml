      - { type: circle, c: [830, 150], r: 4, fill: true }
      - { type: circle, c: [250, 200], r: 4, fill: true }
  vines:
    kind: ornament.thorn-rose
    place: { at: window }
    params:
      weight: 6
      off: 20
      amp: 19
      wave: 240
      thorn: 46
      thorn_len: 20
      thorn_w: 4.5
      leaf: 96
      leaf_len: 50
      roses:
        - [176, 352, 44, 0.3]
        - [908, 480, 36, 2.0]
        - [160, 780, 32, 1.1]
        - [920, 920, 42, 2.6]
        - [176, 1200, 36, 0.7]
        - [902, 1262, 46, 1.8]
        - [470, 308, 30, 1.4]
        - [650, 1272, 30, 0.2]
  text-front:
    kind: shape.draw
    items:
      - { type: text, at: [540, 1404], font: sans, size: 40, track: 1, text: "Nº {edition.no:03} / {edition.of}" }
      - { type: text, at: [540, 1446], font: sans-r, size: 16, track: 2.4, text: "FANCARD  ·  ONE OF {edition.of}  ·  SET {edition.set:02}" }
  text-back:
    kind: shape.draw
    items:
      - { type: text, at: [540, 1404], font: sans, size: 40, track: 1, text: "FANCARD" }
      - { type: text, at: [540, 1446], font: sans-r, size: 16, track: 2.4, text: "ALL HALLOWS' EVE  ·  SET {edition.set:02}" }
  candelabra:
    kind: artwork
    src: ../art/hallows-candelabra.svg
    layers: { fill: "#relief", ink: "#ink", flame: "#flame" }
  title:
    kind: type.signature
    params: { text: "{creator.name}", font: script }
  # back only
  medallion-ring:
    kind: frame.oval-medallion
    params: { ring: 6, dots: 72 }
    place: { at: medallion }
  guilloche:
    kind: shape.draw
    items:
      - { type: rosette, c: [540, 800], r0: 168, r1: 226, count: 132, w: 1.3 }
      - { type: circle, c: [540, 800], r: 164, w: 3 }
      - { type: circle, c: [540, 800], r: 230, w: 3 }
  edition-type:
    kind: type.stack
    place: { in: medallion }
    lines:
      - { text: "Nº",              font: caps,  size: 22,  dy: -84, track: 8 }
      - { text: "{edition.no:03}", font: serif, size: 150, dy: 48 }
      - { text: "ONE OF {edition.of}  ·  SET {edition.set:02}", font: caps, size: 13, dy: 96, track: 4 }
  stars-in:
    kind: shape.draw
    items:
      - { type: scatter, rect: [190, 340, 700, 900], count: 70, r: [1.4, 3.4], seed: 31 }
      - { type: sparkle, at: [250, 420], size: 22 }
      - { type: sparkle, at: [832, 1150], size: 26 }
      - { type: sparkle, at: [830, 430], size: 14 }
      - { type: sparkle, at: [246, 1180], size: 14 }

sides:
  front:
    ops:
      - { op: brush,   params: { angle_deg: 90 } }
      - { op: plate,   mask: card, metal: metal.ground }
      # black pen-work on the silver: starbursts, sparkles, outlines round every raised part
      - { op: engrave, mask: [ink, beads, text-front, "halo(outer-rules,3)", "halo(window-rule,3)", "halo(vines,3)", "halo(vines-leaf,3)", "halo(vines-thorns,2)", "halo(candelabra,3)", "grow(title,7)"], place: { title: sig-title }, params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [ink, beads, text-front, "halo(outer-rules,3)", "halo(window-rule,3)", "halo(vines,3)", "halo(vines-leaf,3)", "halo(vines-thorns,2)", "halo(candelabra,3)", "grow(title,7)"], place: { title: sig-title }, color: enamel.niello }
      # raised silver
      - { op: emboss,  mask: [outer-rules, window-rule], params: { height_mm: 0.1 } }
      - { op: plate,   mask: [outer-rules, window-rule], metal: metal.relief }
      - { op: emboss,  mask: vines-leaf, params: { height_mm: 0.06, soft: 0.6 } }
      - { op: plate,   mask: vines-leaf, metal: metal.relief }
      - { op: emboss,  mask: vines, params: { height_mm: 0.12, soft: 0.7 } }
      - { op: plate,   mask: vines, metal: metal.relief }
      - { op: engrave, mask: [vines-detail, "&vines"], params: { depth_mm: 0.035 } }
      - { op: enamel,  mask: [vines-detail, "&vines"], color: enamel.niello }
      - { op: engrave, mask: [vines-detail, "&vines-leaf"], params: { depth_mm: 0.035 } }
      - { op: enamel,  mask: [vines-detail, "&vines-leaf"], color: enamel.niello }
      - { op: emboss,  mask: vines-thorns, params: { height_mm: 0.14 } }
      - { op: plate,   mask: vines-thorns, metal: metal.glint }
      - { op: emboss,  mask: candelabra, params: { height_mm: 0.12, soft: 0.7 } }
      - { op: plate,   mask: candelabra, metal: metal.relief }
      - { op: engrave, mask: [candelabra-ink, "&candelabra"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [candelabra-ink, "&candelabra"], color: enamel.niello }
      - { op: foil,    mask: candelabra-flame, metal: metal.flame, params: { emboss: 0.4 } }
      # the photo, as shot
      - op: print
        mask: window
        image:
          src: ../assets/hallows.jpg
          focus: [0.56, 0.42]
          filters: []
      # title script: raised mirror inside its black outline
      - { op: emboss,  mask: title, place: { title: sig-title }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: title, place: { title: sig-title }, metal: metal.glint }

  back:
    ops:
      - { op: brush,   params: { angle_deg: 90 } }
      - { op: plate,   mask: card, metal: metal.ground }
      - { op: engrave, mask: [window, ink, beads, text-back, "halo(outer-rules,3)", "halo(window-rule,3)", "halo(vines,3)", "halo(vines-leaf,3)", "halo(vines-thorns,2)", "halo(candelabra,3)", "grow(title,7)"], place: { title: sig-title }, params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [window, ink, beads, text-back, "halo(outer-rules,3)", "halo(window-rule,3)", "halo(vines,3)", "halo(vines-leaf,3)", "halo(vines-thorns,2)", "halo(candelabra,3)", "grow(title,7)"], place: { title: sig-title }, color: enamel.niello }
      - { op: emboss,  mask: [outer-rules, window-rule, medallion-ring, edition-type], params: { height_mm: 0.1 } }
      - { op: plate,   mask: [outer-rules, window-rule, medallion-ring, edition-type], metal: metal.relief }
      - { op: emboss,  mask: [guilloche, "-grow(edition-type,12)"], params: { height_mm: 0.04 } }
      - { op: plate,   mask: [guilloche, "-grow(edition-type,12)"], metal: metal.relief }
      - { op: foil,    mask: [stars-in, "&window", "-grow(medallion-ring,8)", "-grow(guilloche,10)"], metal: metal.glint, params: { emboss: 0.3 } }
      - { op: emboss,  mask: vines-leaf, params: { height_mm: 0.06, soft: 0.6 } }
      - { op: plate,   mask: vines-leaf, metal: metal.relief }
      - { op: emboss,  mask: vines, params: { height_mm: 0.12, soft: 0.7 } }
      - { op: plate,   mask: vines, metal: metal.relief }
      - { op: engrave, mask: [vines-detail, "&vines"], params: { depth_mm: 0.035 } }
      - { op: enamel,  mask: [vines-detail, "&vines"], color: enamel.niello }
      - { op: engrave, mask: [vines-detail, "&vines-leaf"], params: { depth_mm: 0.035 } }
      - { op: enamel,  mask: [vines-detail, "&vines-leaf"], color: enamel.niello }
      - { op: emboss,  mask: vines-thorns, params: { height_mm: 0.14 } }
      - { op: plate,   mask: vines-thorns, metal: metal.glint }
      - { op: emboss,  mask: candelabra, params: { height_mm: 0.12, soft: 0.7 } }
      - { op: plate,   mask: candelabra, metal: metal.relief }
      - { op: engrave, mask: [candelabra-ink, "&candelabra"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [candelabra-ink, "&candelabra"], color: enamel.niello }
      - { op: foil,    mask: candelabra-flame, metal: metal.flame, params: { emboss: 0.4 } }
      - { op: emboss,  mask: title, place: { title: sig-title }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: title, place: { title: sig-title }, metal: metal.glint }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
