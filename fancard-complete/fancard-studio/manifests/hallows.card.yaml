      - { type: line, from: [88, 520], to: [71, 520], w: 2.6 }
      - { type: line, from: [66, 520], to: [50, 520], w: 2.6 }
      - { type: line, from: [90, 514], to: [85, 509], w: 1.8 }
      - { type: line, from: [83, 507], to: [76, 500], w: 1.8 }
      - { type: line, from: [96, 512], to: [96, 495], w: 2.6 }
      - { type: line, from: [96, 490], to: [96, 474], w: 2.6 }
      - { type: line, from: [102, 514], to: [107, 509], w: 1.8 }
      - { type: line, from: [109, 507], to: [116, 500], w: 1.8 }
      - { type: circle, c: [96, 520], r: 4.1, fill: true }
      - { type: line, from: [994, 700], to: [1010, 700], w: 2.6 }
      - { type: line, from: [1015, 700], to: [1030, 700], w: 2.6 }
