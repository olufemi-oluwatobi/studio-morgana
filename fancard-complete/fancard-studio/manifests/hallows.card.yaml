# FANCARD MANIFEST v0.2 · All Hallows, Set 01 · "Candlelit Silver"
# After the Paracosm poster: light silver ground drawn in black niello like pen on paper,
# a thorny vine-and-rose frame wrapping a portrait window, starbursts, a swirly script title,
# and candelabras with gold-foil flames in the bottom corners. The photo is printed as shot.
# Artwork: art/hallows-candelabra.svg (regenerate with art/hallows-candelabra.py)
# Build:  python3 fancard.py manifests/hallows.card.yaml

fancard: 0.2
id: hallows/set-01
template: candlelit-silver@1
seed: 20261031

edition: { "no": 1, of: 100, set: 1 }
creator: { name: All Hallows }     # card title; swap for her name when known

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1080, 1669]

zones:
  card:       { rect: [11, 11, 1058, 1647], r: 54 }
  window:     { rect: [170, 320, 740, 940], r: 6 }
  medallion:  { center: [540, 800], rx: 250, ry: 320 }
  sig-title:  { center: [540, 238], max_width: 660, size: 200, rotate_deg: -4, overlay: true }

tokens:
  enamel:
    niello: { name: niello, hex: "#0b0c0f", process: niello-inlay }
  metal:
    ground: { finish: silver, polish: satin }
    relief: { finish: silver, polish: mirror }
    glint:  { finish: mirror-chrome, polish: mirror }
    flame:  { finish: gold-24k, polish: mirror }
  type:
    serif:  { family: Bodoni Moda, weight: 700, style: italic }
    caps:   { family: Bodoni Moda, weight: 400 }
    sans:   { family: Jost, weight: 700 }
    sans-r: { family: Jost, weight: 500 }
    script: { family: Mrs Saint Delafield }

