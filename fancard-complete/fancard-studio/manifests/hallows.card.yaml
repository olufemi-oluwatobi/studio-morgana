  outer-rules:
    kind: shape.draw
    items:
      - { type: rect, rect: [26, 26, 1028, 1617], r: 46, w: 4 }
      - { type: rect, rect: [40, 40, 1000, 1589], r: 34, w: 1.6 }
  beads:
    kind: shape.draw
    items:
      - { type: dotline, from: [100, 54], to: [980, 54], step: 14, r: 2 }
      - { type: dotline, from: [100, 1615], to: [980, 1615], step: 14, r: 2 }
  window-rule:
    kind: shape.draw
    items:
      - { type: rect, rect: [160, 310, 760, 960], r: 10, w: 7 }
