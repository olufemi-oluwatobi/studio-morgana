    ivory:  { name: ivory-pearl, hex: "#efe6d8", process: soft-enamel }
  metal:
    black:  { finish: mirror-black, polish: mirror }
    chrome: { finish: mirror-chrome, polish: mirror }
  type:
    serif:  { family: Bodoni Moda, weight: 400, style: italic }
    caps:   { family: Bodoni Moda, weight: 400 }
    script: { family: Herr Von Muellerhoff }

