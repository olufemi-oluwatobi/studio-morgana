    kind: shape.draw
    items:
      - { type: text, at: [620, 284], font: serif, size: 64, text: fancard }
      - { type: sparkle, at: [500, 262], size: 10 }
      - { type: sparkle, at: [740, 262], size: 10 }
  sparkles:
    kind: shape.draw
    items:
      - { type: sparkle, at: [300, 1330], size: 16 }
      - { type: sparkle, at: [944, 1520], size: 13 }
      - { type: sparkle, at: [262, 1560], size: 9 }
      - { type: sparkle, at: [978, 1312], size: 9 }
  back-centre:
    kind: shape.draw
    items:
      - { type: text, at: [620, 800], font: serif, size: 168, text: fancard }
      - { type: text, at: [620, 884], font: caps, size: 26, track: 14, text: "Nº 001" }
      - { type: text, at: [620, 924], font: caps, size: 15, track: 8, text: "CONCEPT CARD  ·  NOT FOR SALE" }
      - { type: sparkle, at: [620, 640], size: 26 }
  signature:
    kind: type.signature
    params: { text: "{creator.name}", font: script }

sides:
  front:
    silhouette: [art]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      # mirror engraving: spotlight rays inside the panel, left unfilled so they catch light
      - { op: engrave, mask: [rays-front, "&panel", -band, "-grow(signature,16)", "-grow(wordmark,10)"], place: { signature: sig }, params: { depth_mm: 0.02 } }
      # ivory ink: natural engraving band, text band, wordmark, sparkles
      - { op: engrave, mask: [art-nature, art-textfront, wordmark, sparkles], params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [art-nature, art-textfront, wordmark, sparkles], color: enamel.ivory }
      # frame 1: heavy chrome ironwork, black grooves, blush-pearl spray
      - { op: emboss,  mask: art, params: { height_mm: 0.16, soft: 0.7 } }
      - { op: plate,   mask: art, metal: metal.chrome }
      - { op: engrave, mask: [art-groove, "&art"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [art-groove, "&art"], color: enamel.niello }
      - { op: spray,   kind: pearl, mask: art, params: { color: "#f6e3e6", flop: ["#ffd6e0", "#efe6da", "#e4dcf6"], opacity: 0.5, thickness_um: 35 } }
      - op: print
        mask: window
        image: { src: ../assets/marilyn.jpg, focus: [0.5, 0.25], filters: [] }
      - { op: spray,   kind: gloss, mask: window, params: { thickness_um: 30 } }
      - { op: spray,   kind: pearl, mask: [art-nature, art-textfront, wordmark], params: { color: "#efe6d8", opacity: 0.35, thickness_um: 20 } }
      # signature: black outline, raised chrome
      - { op: engrave, mask: "grow(signature,9)", place: { signature: sig }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: "grow(signature,9)", place: { signature: sig }, color: enamel.niello }
      - { op: emboss,  mask: signature, place: { signature: sig }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: signature, place: { signature: sig }, metal: metal.chrome }
  back:
    silhouette: [art]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      - { op: engrave, mask: [rays-back, "&panel", "-grow(back-centre,14)", "-grow(signature,16)"], place: { signature: sig }, params: { depth_mm: 0.02 } }
      - { op: engrave, mask: [art-nature, art-textback, back-centre, sparkles], params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [art-nature, art-textback, back-centre, sparkles], color: enamel.ivory }
      - { op: emboss,  mask: art, params: { height_mm: 0.16, soft: 0.7 } }
      - { op: plate,   mask: art, metal: metal.chrome }
      - { op: engrave, mask: [art-groove, "&art"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [art-groove, "&art"], color: enamel.niello }
      - { op: spray,   kind: pearl, mask: art, params: { color: "#f6e3e6", flop: ["#ffd6e0", "#efe6da", "#e4dcf6"], opacity: 0.5, thickness_um: 35 } }
      - { op: spray,   kind: pearl, mask: [art-nature, art-textback, back-centre], params: { color: "#efe6d8", opacity: 0.35, thickness_um: 20 } }
      - { op: engrave, mask: "grow(signature,9)", place: { signature: sig }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: "grow(signature,9)", place: { signature: sig }, color: enamel.niello }
      - { op: emboss,  mask: signature, place: { signature: sig }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: signature, place: { signature: sig }, metal: metal.chrome }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
