# FANCARD MANIFEST v0.2 · Marilyn Monroe · CONCEPT CARD v2 (not for sale)
# From the edge in: (1) heavy chrome ironwork covering the card edges, breaking out of the outline,
# (2) a band of natural vine-and-leaf engraving cut into the mirror, (3) a square band of her films
# and years round the photo. "fancard" at the top, her signature at the bottom.
# Inks: ivory pearl enamel in the engravings, blush-pearl spray on the ironwork, black only in the grooves
# and the signature outline. No red, no gold in the design (photo printed as shot).
# Art: art/marilyn2-art.py   Build: python3 fancard.py manifests/marilyn2.card.yaml

fancard: 0.2
id: marilyn/concept-02
template: vanity-mirror@0
seed: 19260601

edition: { "no": 1, of: 1, set: 1 }
creator: { name: Marilyn }

blank:
