  credits:
    kind: shape.draw
    items:
      - { type: text, at: [620, 1342], font: caps, size: 36, track: 16, text: "MARILYN MONROE" }
      - { type: text, at: [282, 1418], font: caps, size: 19, track: 2.5, text: "NIAGARA" }
      - { type: text, at: [282, 1450], font: caps, size: 19, track: 2.5, text: "BUS STOP" }
      - { type: text, at: [620, 1418], font: caps, size: 19, track: 2.5, text: "GENTLEMEN PREFER BLONDES" }
      - { type: text, at: [620, 1450], font: caps, size: 19, track: 2.5, text: "THE SEVEN YEAR ITCH" }
      - { type: text, at: [958, 1418], font: caps, size: 19, track: 2.5, text: "SOME LIKE IT HOT" }
      - { type: text, at: [958, 1450], font: caps, size: 19, track: 2.5, text: "THE MISFITS" }
      - { type: text, at: [620, 1540], font: caps, size: 14, track: 7, text: "CONCEPT CARD  ·  NOT FOR SALE" }
      - { type: sparkle, at: [470, 1386], size: 9 }
      - { type: sparkle, at: [770, 1386], size: 9 }
  medallion-ring:
    kind: frame.oval-medallion
    params: { ring: 7, dots: 90 }
    place: { at: medallion }
  back-type:
    kind: shape.draw
    items:
      - { type: ring-text, c: [620, 915], r: 262, font: caps, size: 18, upper: true,
          text: "marilyn monroe  ·  1926 – 1962  ·  the silver screen  ·  concept card  ·  not for sale  ·  " }
      - { type: circle, c: [620, 915], r: 232, w: 2 }
      - { type: circle, c: [620, 915], r: 292, w: 3 }
      - { type: text, at: [620, 1000], font: serif, size: 300, text: "M" }
      - { type: text, at: [620, 1470], font: caps, size: 28, track: 12, text: "Nº 001" }
      - { type: text, at: [620, 1520], font: caps, size: 14, track: 7, text: "CONCEPT CARD  ·  NOT FOR SALE" }
  title:
    kind: type.signature
    params: { text: "{creator.name}", font: script }

sides:
  front:
    silhouette: [ironwork]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      - { op: engrave, mask: [rays-front, -frame-zone, "-grow(ironwork,10)"], params: { depth_mm: 0.02 } }
      - { op: emboss,  mask: [frame, ironwork], params: { height_mm: 0.14, soft: 0.7 } }
      - { op: plate,   mask: [frame, ironwork], metal: metal.chrome }
      - { op: engrave, mask: [ironwork-ink, "&ironwork"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [ironwork-ink, "&ironwork"], color: enamel.niello }
      - op: print
        mask: window
        image: { src: ../assets/marilyn.jpg, focus: [0.5, 0.28], filters: [] }
      - { op: spray, kind: gloss, mask: window, params: { thickness_um: 30 } }
      - { op: spray, kind: pearl, mask: [ironwork, frame], params: { opacity: 0.38, thickness_um: 30 } }
      - { op: emboss,  mask: credits, params: { height_mm: 0.05 } }
      - { op: plate,   mask: credits, metal: metal.chrome }
      - { op: engrave, mask: "grow(title,9)", place: { title: sig-title }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: "grow(title,9)", place: { title: sig-title }, color: enamel.niello }
      - { op: emboss,  mask: title, place: { title: sig-title }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: title, place: { title: sig-title }, metal: metal.chrome }
  back:
    silhouette: [ironwork]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      - { op: engrave, mask: [rays-back, -medallion-face, "-grow(ironwork,10)"], params: { depth_mm: 0.02 } }
      - { op: emboss,  mask: [ironwork, medallion-ring, back-type], params: { height_mm: 0.14, soft: 0.7 } }
      - { op: plate,   mask: [ironwork, medallion-ring, back-type], metal: metal.chrome }
      - { op: engrave, mask: [ironwork-ink, "&ironwork"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [ironwork-ink, "&ironwork"], color: enamel.niello }
      - { op: spray, kind: gloss, mask: medallion-face, params: { thickness_um: 40 } }
      - { op: spray, kind: pearl, mask: [ironwork, medallion-ring], params: { opacity: 0.38, thickness_um: 30 } }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
