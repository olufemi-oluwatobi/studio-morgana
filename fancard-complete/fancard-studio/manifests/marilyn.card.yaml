# FANCARD MANIFEST v0.2 · Marilyn Monroe · CONCEPT CARD (not for sale)
# Retro silver-screen palette: black mirror, mirror chrome, pearl. No red, no gold in the design
# (the photo is printed as shot). Heavy art-nouveau whiplash ironwork breaks out of the photo frame
# AND the card outline: the card is digital, so `silhouette` adds the ironwork to the card's shape.
# Mirror engraving: spotlight rays cut into the black mirror. Spray: pearl over the ironwork, gloss over the photo.
# Art: art/marilyn-ornaments.py   Build: python3 fancard.py manifests/marilyn.card.yaml

fancard: 0.2
id: marilyn/concept-01
template: silver-screen-nouveau@0
seed: 19260601

edition: { "no": 1, of: 1, set: 1 }
creator: { name: Marilyn }

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1240, 1829]          # card body sits inset 80 px so the ironwork has room to break out

zones:
  card:     { rect: [80, 80, 1080, 1669], r: 54 }
  window:   { rect: [240, 290, 760, 980], r: 6 }
  medallion: { center: [620, 915], rx: 330, ry: 440 }
  medallion-face: { center: [620, 915], rx: 342, ry: 452 }
  sig-title: { center: [620, 1150], max_width: 860, size: 250, rotate_deg: -8, overlay: true }

tokens:
  enamel:
    niello: { name: niello, hex: "#0b0c0f", process: niello-inlay }
  metal:
    black:  { finish: mirror-black, polish: mirror }
    chrome: { finish: mirror-chrome, polish: mirror }
  type:
    caps:   { family: Bodoni Moda, weight: 400 }
    serif:  { family: Bodoni Moda, weight: 700, style: italic }
    script: { family: Herr Von Muellerhoff }

components:
  ironwork:
    kind: artwork
    src: ../art/marilyn-ornaments.svg
    layers: { fill: "#relief", ink: "#ink" }
  frame:
    kind: shape.draw
    items:
      - { type: rect, rect: [224, 274, 792, 1012], r: 12, w: 7 }
      - { type: rect, rect: [206, 256, 828, 1048], r: 20, w: 2 }
  frame-zone:
    kind: shape.draw
    items:
      - { type: rect, rect: [196, 246, 848, 1068], r: 24, fill: true }
