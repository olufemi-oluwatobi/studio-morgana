# FANCARD MANIFEST v0.2 · "Prom Queen" (tiara edition), Set 05
# Template: tiara-filigree@2 — mirror-chrome blank; elaborate satin-silver filigree lifted from her
# tiara, openings in midnight enamel, crystal-set; raised metallic signature; frosted engraved wordmark.
# Build:  python3 fancard.py manifests/prom-queen.tiara.card.yaml

fancard: 0.2
id: prom-queen/set-05-tiara
template: tiara-filigree@2
seed: 19990522

edition: { "no": 24, of: 100, set: 5 }
creator: { name: Lola Rennes }        # placeholder signature — replace with the creator's own

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1080, 1669]

zones:
  card:     { rect: [11, 11, 1058, 1647], r: 54 }
  window:   { rect: [176, 344, 728, 974], arch: 176, r: 22 }
  sig-front: { center: [540, 1572], max_width: 720, size: 150, rotate_deg: -4, overlay: true }
  sig-back:  { center: [540, 1572], max_width: 720, size: 150, rotate_deg: -4, overlay: true }

tokens:
  enamel:
    midnight: { name: midnight, hex: "#0c1a4a", process: soft-enamel }
  metal:
    ground:  { finish: mirror-chrome }
    relief:  { finish: silver, polish: satin }
    stones:  { finish: crystal }
    glint:   { finish: silver, polish: mirror }
  type:
    serif:  { family: Bodoni Moda, weight: 700, style: italic }
    serif-r: { family: Bodoni Moda, weight: 400, style: italic }
    caps-r: { family: Bodoni Moda, weight: 400 }
    script: { family: Mr Dafoe }
  filter:
    wash: night-blue

components:
  filigree:
    kind: ornament.tiara-filigree
    place: { at: window }
    params: { weight: 7, spread: 70, fan: 0.27, chain: 124, border: 26, sag: 34, pendant: 64,
              crest: [[0, 176, 104], [1, 148, 88], [2, 120, 76], [3, 94, 64], [4, 70, 50]] }

  wordmark:                 # laser-engraved into the mirror: frosted, no panel, no cutout
    kind: shape.draw
    items:
      - { type: text, at: [540, 98], font: serif-r, size: 40, text: fancard }

  signature:
    kind: type.signature
    params: { text: "{creator.name}", font: script }

  sparkles:
    kind: shape.draw
    items:
      - { type: sparkle, at: [250, 640], size: 24 }
      - { type: sparkle, at: [842, 560], size: 30 }
      - { type: sparkle, at: [860, 1090], size: 18 }
      - { type: sparkle, at: [226, 1240], size: 20 }

  # ── back: all metal ──
  guilloche:                # engine-turned engraving filling the arch, cleared around the medallion
    kind: shape.draw
    items:
      - { type: hatch, rect: [176, 344, 728, 974], angle: 60, step: 20, w: 1.3 }
      - { type: hatch, rect: [176, 344, 728, 974], angle: -60, step: 20, w: 1.3 }
  medallion-clear:
    kind: shape.draw
    items:
      - { type: circle, c: [540, 900], r: 300, fill: true }
  rosette:
    kind: shape.draw
    items:
      - { type: rosette, c: [540, 900], r0: 158, r1: 246, count: 96, w: 1.2 }
  medallion-ring:
    kind: shape.draw
    items:
      - { type: circle, c: [540, 900], r: 156, w: 3 }
      - { type: circle, c: [540, 900], r: 252, w: 5 }
      - { type: circle, c: [540, 900], r: 288, w: 2.5 }
  medallion-stones:
    kind: shape.draw
    items:
      - { type: stone-ring, c: [540, 900], rx: 270, ry: 270, n: 72, r: 8 }
  back-number:
    kind: shape.draw
    items:
      - { type: text, at: [540, 965], font: serif, size: 190, text: "{edition.no:03}" }
  back-small:
    kind: shape.draw
    items:
      - { type: text, at: [540, 800], font: caps-r, size: 22, track: 8, text: "Nº" }
      - { type: text, at: [540, 1000], font: caps-r, size: 13, track: 3.5, text: "ONE OF {edition.of} · SET {edition.set:02}" }

sides:
  front:
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.ground }
      - { op: emboss,  mask: filigree, params: { height_mm: 0.08 } }
      - { op: plate,   mask: filigree, metal: metal.relief }
      - { op: engrave, mask: filigree-holes, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: filigree-holes, color: enamel.midnight }
      - { op: emboss,  mask: filigree-stones, params: { height_mm: 0.22, soft: 2.6 } }
      - { op: plate,   mask: filigree-stones, metal: metal.stones }
      - { op: engrave, mask: wordmark, params: { depth_mm: 0.04 } }
      - { op: etch,    mask: wordmark }
      - { op: emboss,  mask: signature, place: { signature: sig-front }, params: { height_mm: 0.12 } }
      - { op: plate,   mask: signature, place: { signature: sig-front }, metal: metal.relief }
      - op: print
        mask: window
        image:
          src: ../assets/tiara-night.jpg
          focus: [0.5, 0.42]
          filters:
            - { kind: grade,      preset: filter.wash }
            - { kind: split-tone, shadows: "#061a6e", highlights: "#d4e8ff", amount: 0.6 }
            - { kind: fade,       amount: 0.05, color: "#0a1430" }
            - { kind: halation,   threshold: 0.78, radius: 18, color: "#3f9cff", amount: 0.55 }
            - { kind: halftone,   cell: 9, amount: 0.18 }
            - { kind: vignette,   amount: 0.55 }
            - { kind: grain,      amount: 0.06, size: 0.85, chroma: 0.02 }
      - { op: foil, mask: sparkles, metal: metal.glint, params: { emboss: 0.3 } }

  back:
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.ground }
      - { op: engrave, mask: [guilloche, -medallion-clear, rosette], params: { depth_mm: 0.03 } }
      - { op: etch,    mask: [guilloche, -medallion-clear, rosette] }
      - { op: emboss,  mask: [filigree, medallion-ring], params: { height_mm: 0.08 } }
      - { op: plate,   mask: [filigree, medallion-ring], metal: metal.relief }
      - { op: engrave, mask: filigree-holes, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: filigree-holes, color: enamel.midnight }
      - { op: emboss,  mask: [filigree-stones, medallion-stones], params: { height_mm: 0.22, soft: 2.6 } }
      - { op: plate,   mask: [filigree-stones, medallion-stones], metal: metal.stones }
      - { op: emboss,  mask: back-number, params: { height_mm: 0.12 } }
      - { op: plate,   mask: back-number, metal: metal.relief }
      - { op: engrave, mask: [wordmark, back-small], params: { depth_mm: 0.04 } }
      - { op: etch,    mask: [wordmark, back-small] }
      - { op: emboss,  mask: signature, place: { signature: sig-back }, params: { height_mm: 0.12 } }
      - { op: plate,   mask: signature, place: { signature: sig-back }, metal: metal.relief }

render:
  lights: [-1, 0, 1]
  bench: "#0b0e1a"
produce:
  separations: per-op
