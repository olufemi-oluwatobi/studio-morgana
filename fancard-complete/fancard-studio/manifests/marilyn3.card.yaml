# FANCARD MANIFEST v0.2 · Marilyn Monroe · CONCEPT CARD v3 (not for sale)
# Her photo fills the whole centre. Everything else lives in a studded bezel:
#   heavy chrome ironwork bar (breaks out of the card outline) set with crystal rhinestones and chrome beads,
#   an engraved vine band and a square band of her films, both in ivory pearl ink.
# "fancard" in the gap at the top, her signature over the bottom of the photo.
# Art: art/marilyn3-art.py   Build: python3 fancard.py manifests/marilyn3.card.yaml

fancard: 0.2
id: marilyn/concept-03
template: studded-vanity@0
seed: 19260601

edition: { "no": 1, of: 1, set: 1 }
creator: { name: Marilyn }

blank:
  stock: stainless
  thickness_mm: 0.8
  size_mm: [54, 83.43]
  grid: [1240, 1829]

zones:
  card:     { rect: [80, 80, 1080, 1669], r: 54 }
  window:   { rect: [242, 242, 756, 1345], r: 9 }
  sig-front: { center: [620, 1478], max_width: 620, size: 250, rotate_deg: -6, overlay: true }
  sig-back:  { center: [620, 900], max_width: 680, size: 320, rotate_deg: -6, overlay: true }

tokens:
  enamel:
    niello: { name: niello, hex: "#0b0c0f", process: niello-inlay }
    ivory:  { name: ivory-pearl, hex: "#efe6d8", process: soft-enamel }
  metal:
    black:   { finish: mirror-black, polish: mirror }
    chrome:  { finish: mirror-chrome, polish: mirror }
    crystal: { finish: crystal }
  type:
    serif:  { family: Bodoni Moda, weight: 400, style: italic }
    caps:   { family: Bodoni Moda, weight: 400 }
    script: { family: Herr Von Muellerhoff }

components:
  art:
    kind: artwork
    src: ../art/marilyn3-art.svg
    layers: { fill: "#frame", groove: "#groove", studs: "#studs", beads: "#beads", nature: "#nature", textfront: "#textfront", textback: "#textback" }
  wordmark:
    kind: shape.draw
    items:
      - { type: text, at: [620, 230], font: serif, size: 58, text: fancard }
  rays:
