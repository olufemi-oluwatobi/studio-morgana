sides:
  front:
    silhouette: [art]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      - { op: engrave, mask: [art-nature, art-textfront], params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [art-nature, art-textfront], color: enamel.ivory }
      - { op: emboss,  mask: art, params: { height_mm: 0.16, soft: 0.7 } }
      - { op: plate,   mask: art, metal: metal.chrome }
      - { op: engrave, mask: [art-groove, "&art"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [art-groove, "&art"], color: enamel.niello }
      - { op: spray,   kind: pearl, mask: art, params: { color: "#f6e3e6", flop: ["#ffd6e0", "#efe6da", "#e4dcf6"], opacity: 0.45, thickness_um: 35 } }
      - { op: emboss,  mask: art-beads, params: { height_mm: 0.12, soft: 1 } }
      - { op: plate,   mask: art-beads, metal: metal.chrome }
      - { op: emboss,  mask: art-studs, params: { height_mm: 0.24, soft: 1 } }
      - { op: plate,   mask: art-studs, metal: metal.crystal }
      - op: print
        mask: window
        image: { src: ../assets/marilyn.jpg, focus: [0.5, 0.2], filters: [] }
      - { op: spray,   kind: gloss, mask: window, params: { thickness_um: 30 } }
      - { op: spray,   kind: pearl, mask: [art-nature, art-textfront], params: { color: "#efe6d8", opacity: 0.3, thickness_um: 20 } }
      - { op: engrave, mask: ["grow(wordmark,7)", "grow(signature,9)"], place: { signature: sig-front }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: ["grow(wordmark,7)", "grow(signature,9)"], place: { signature: sig-front }, color: enamel.niello }
      - { op: emboss,  mask: [wordmark, signature], place: { signature: sig-front }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: [wordmark, signature], place: { signature: sig-front }, metal: metal.chrome }
  back:
    silhouette: [art]
    ops:
      - { op: brush,   params: { angle_deg: 0 } }
      - { op: plate,   mask: card, metal: metal.black }
      - { op: engrave, mask: [rays, "&window", "-grow(signature,18)", "-grow(back-lines,12)"], place: { signature: sig-back }, params: { depth_mm: 0.02 } }
      - { op: engrave, mask: [art-nature, art-textback, back-lines], params: { depth_mm: 0.04 } }
      - { op: enamel,  mask: [art-nature, art-textback, back-lines], color: enamel.ivory }
      - { op: emboss,  mask: art, params: { height_mm: 0.16, soft: 0.7 } }
      - { op: plate,   mask: art, metal: metal.chrome }
      - { op: engrave, mask: [art-groove, "&art"], params: { depth_mm: 0.03 } }
      - { op: enamel,  mask: [art-groove, "&art"], color: enamel.niello }
      - { op: spray,   kind: pearl, mask: art, params: { color: "#f6e3e6", flop: ["#ffd6e0", "#efe6da", "#e4dcf6"], opacity: 0.45, thickness_um: 35 } }
      - { op: emboss,  mask: art-beads, params: { height_mm: 0.12, soft: 1 } }
      - { op: plate,   mask: art-beads, metal: metal.chrome }
      - { op: emboss,  mask: art-studs, params: { height_mm: 0.24, soft: 1 } }
      - { op: plate,   mask: art-studs, metal: metal.crystal }
      - { op: spray,   kind: pearl, mask: [art-nature, art-textback, back-lines], params: { color: "#efe6d8", opacity: 0.3, thickness_um: 20 } }
      - { op: engrave, mask: ["grow(wordmark,7)", "grow(signature,10)"], place: { signature: sig-back }, params: { depth_mm: 0.05 } }
      - { op: enamel,  mask: ["grow(wordmark,7)", "grow(signature,10)"], place: { signature: sig-back }, color: enamel.niello }
      - { op: emboss,  mask: [wordmark, signature], place: { signature: sig-back }, params: { height_mm: 0.2 } }
      - { op: plate,   mask: [wordmark, signature], place: { signature: sig-back }, metal: metal.chrome }

render:
  lights: [-1, 0, 1]
  bench: "#0e0f12"
produce:
  separations: per-op
