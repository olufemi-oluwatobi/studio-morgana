<style>
/* Layout: a tall idol-style photocard. Her full photo fills the window; holo foil, a black inner frame and a title bar carry all the design. */
:root{
  --desk:#101014;
  --desk-2:#1d1a24;
  --bone:#efe9df;
  --muted:#a9a3b4;
  --bar:#a48cff;
  --cond:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:"Martian Mono","SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--bone);font-family:var(--mono);overflow-x:hidden}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,var(--desk-2),transparent 65%),var(--desk)}
.top{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--serif);font-style:italic;font-weight:900;font-size:26px;line-height:1;color:var(--bar)}
.serial{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{position:relative;perspective:1100px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;max-width:100%}
.stage:focus-visible{outline:2px solid var(--bar);outline-offset:4px}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.shadow{position:absolute;left:8%;right:8%;bottom:-2.5%;height:5%;background:radial-gradient(closest-side,rgba(0,0,0,.8),transparent);filter:blur(8px);transform:translateZ(-60px)}
.hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.sw{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--desk-2);cursor:pointer;box-shadow:0 0 0 1.5px rgba(239,233,223,.35)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bone)}
.sw:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.price{font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--bar);color:#140f22;padding:9px 14px;border-radius:999px;font-variant-numeric:tabular-nums;margin-left:6px}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:12px;color:var(--muted)}
</style>

let back=0;

let target={x:0,y:0},tilt={x:0,y:0},vel={x:0,y:0},dragging=false,lastMove=-1e9,flip=0,flipT=0,fv=0,down=null;
