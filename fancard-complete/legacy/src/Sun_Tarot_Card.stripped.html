<style>
/* One tarot-style fan card: sepia-gold photo in a black and gold engraved frame. Drag to tilt, tap to flip. */
:root{--bg:#120d06;--ink:#f3e4b8;--mute:#a8956a;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#efe6d2;--ink:#2a1f0c;--mute:#6f5f3c;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe6d2;--ink:#2a1f0c;--mute:#6f5f3c;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 Cinzel,Georgia,serif;display:grid;place-items:center;min-height:100%;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap{display:grid;justify-items:center;gap:18px}
.stage{width:min(88vw,420px,calc((100svh - 120px) / 1.7));perspective:1200px;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.in{position:relative;width:100%;aspect-ratio:600/1020;will-change:transform;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.face{position:absolute;inset:0}
.face svg{display:block;width:100%;height:100%}
.back{transform:scaleX(-1);visibility:hidden}
.in.flip .front{visibility:hidden}.in.flip .back{visibility:visible}
.glare{position:absolute;inset:0;border-radius:5%/2.9%;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .35s}
.glare.on{opacity:1}
.glare i{position:absolute;left:-50%;top:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,240,200,.28),rgba(255,240,200,0) 26%);will-change:transform}
.sheen{position:absolute;inset:0;border-radius:5%/2.9%;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:linear-gradient(115deg,transparent 30%,rgba(255,236,180,.16) 45%,rgba(255,255,255,.05) 50%,transparent 62%);background-size:220% 220%;background-position:var(--sx,50%) 50%}
.hint{margin:0;color:var(--mute);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
</style>

<script>
(()=>{
const stage=document.getElementById('stage'),inn=document.getElementById('in'),g=document.getElementById('glare'),gi=g.firstChild,grad=document.getElementById('gold');
const sheens=[...document.querySelectorAll('.sheen')];
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const c={tx:0,ty:0,x:0,y:0,vx:0,vy:0,flip:0,flipT:0,fv:0,drag:false,hover:false,back:false,gon:false};
let running=false,last=0,down=null;
const at=e=>{const r=stage.getBoundingClientRect();c.tx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width*2-1)*1.1));c.ty=Math.max(-1,Math.min(1,-((e.clientY-r.top)/r.height*2-1)*1.1))};
stage.addEventListener('pointerdown',e=>{c.drag=true;down={x:e.clientX,y:e.clientY,t:performance.now()};at(e);wake()});
stage.addEventListener('pointermove',e=>{if(c.drag||e.pointerType==='mouse'){c.hover=true;at(e);wake()}});
const end=e=>{if(down&&e&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8&&performance.now()-down.t<400)c.flipT=c.flipT?0:1;down=null;c.drag=false;c.hover=false;c.tx=0;c.ty=0;wake()};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',()=>end());
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){c.hover=false;c.drag=false;c.tx=0;c.ty=0;wake()}});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.flipT=c.flipT?0:1;wake()}});
function wake(){if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  let tx=c.tx,ty=c.ty;const idle=!calm&&!c.drag&&!c.hover;
  if(idle){tx=Math.sin(t*.6)*.38;ty=Math.sin(t*.45+1)*.24}
  const k=c.drag?80:36,d=c.drag?13:8;
  c.vx+=((tx-c.x)*k-c.vx*d)*dt;c.vy+=((ty-c.y)*k-c.vy*d)*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
  if(calm)c.flip=c.flipT;else{c.fv+=((c.flipT-c.flip)*70-c.fv*12)*dt;c.flip+=c.fv*dt}
  const b=c.flip>.5;if(b!==c.back){c.back=b;inn.classList.toggle('flip',b)}
  const sx=b?-c.x:c.x;
  inn.style.transform=`rotateY(${(c.x*14+c.flip*180).toFixed(2)}deg) rotateX(${(c.y*10).toFixed(2)}deg)`;
  gi.style.transform=`translate3d(${(sx*28).toFixed(1)}%,${(-c.y*28).toFixed(1)}%,0)`;
  grad.setAttribute('gradientTransform',`translate(${(sx*260).toFixed(1)} ${(-c.y*200).toFixed(1)})`);
  const sp=(50-sx*45).toFixed(1)+'%';for(const s of sheens)s.style.setProperty('--sx',sp);
  const on=c.drag||c.hover||idle;if(on!==c.gon){c.gon=on;g.classList.toggle('on',on)}
  if(idle||Math.abs(c.vx)+Math.abs(c.vy)+Math.abs(c.fv)>.002||Math.abs(tx-c.x)+Math.abs(ty-c.y)+Math.abs(c.flipT-c.flip)>.002)requestAnimationFrame(tick);else running=false;
}
wake();
})();
</script>
